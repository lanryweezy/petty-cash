{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-cash-coin text-primary" style="font-size: 3.5rem;"></i>
                <h2 class="mt-2 fw-bold">Petty Cash</h2>
                <p class="text-muted">Sign in to manage your requests</p>
            </div>

            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <form method="POST">
                        <div class="mb-4">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Enter username" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">
                                Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4 text-muted small">
                &copy; {{ session.get('year', '2024') }} Petty Cash System
            </div>
        </div>
    </div>
</div>
{% endblock %}
